name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows installer
            os: windows-2022
            artifact: windows
          - name: Linux installer
            os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out OGDD
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux runtime checks
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            xauth \
            xvfb

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Install OGDD and packaging tools
        run: python -m pip install ".[gui,build]"

      - name: Run tests
        run: python -m pip install pytest pytest-qt && python -m pytest -q

      - name: Build native installer
        run: python tools/build_installer.py

      - name: Check frozen Windows application startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Hosted Windows runners have no interactive OpenGL desktop.  This
          # mode still imports every frozen module and constructs the complete
          # Qt/VTK window, but deliberately does not show the render widget.
          $env:OGDD_HEADLESS_STARTUP_CHECK = "1"
          $process = Start-Process "dist/pyinstaller/OGDD/OGDD.exe" -ArgumentList "--check-startup" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Host "OGDD startup check exited with code $($process.ExitCode)."
            if (Test-Path "ogdd-startup-error.log") {
              Get-Content "ogdd-startup-error.log"
            } else {
              Write-Host "No Python startup diagnostic was produced."
            }
            exit $process.ExitCode
          }

      - name: Check frozen Linux application startup
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/pyinstaller/OGDD/OGDD --check-startup

      - name: Test Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/installers/OGDD-*-Windows-x64-Setup.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "The Windows installer was not created."
          }
          $setup = Start-Process $installer.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "The Windows installer exited with code $($setup.ExitCode)."
          }
          $installRoot = Join-Path $env:LOCALAPPDATA "Programs/OGDD"
          $installedApplication = Join-Path $installRoot "OGDD.exe"
          if (-not (Test-Path $installedApplication)) {
            throw "OGDD.exe was not installed in $installRoot."
          }
          $env:OGDD_HEADLESS_STARTUP_CHECK = "1"
          $check = Start-Process $installedApplication -ArgumentList "--check-startup" -Wait -PassThru
          if ($check.ExitCode -ne 0) {
            throw "The installed application exited with code $($check.ExitCode)."
          }
          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "The Windows uninstaller was not installed."
          }
          $uninstall = Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "The Windows uninstaller exited with code $($uninstall.ExitCode)."
          }
          if (Test-Path $installedApplication) {
            throw "OGDD.exe remained after uninstallation."
          }

      - name: Test Linux installer lifecycle
        if: runner.os == 'Linux'
        run: |
          test_home=$(mktemp -d)
          trap 'rm -rf "${test_home}"' EXIT
          export HOME="${test_home}"
          export XDG_DATA_HOME="${test_home}/.local/share"
          installer=$(find dist/installers -name 'OGDD-*-Linux-x86_64.run' -print -quit)
          test -n "${installer}"
          "${installer}"
          installed_application="${XDG_DATA_HOME}/ogdd/OGDD/OGDD"
          installed_icon="${XDG_DATA_HOME}/ogdd/OGDD/ogdd-logo.png"
          desktop_file="${XDG_DATA_HOME}/applications/org.ogdd.OGDD.desktop"
          test -x "${installed_application}"
          test -f "${installed_icon}"
          test -f "${desktop_file}"
          grep -F "Icon=${installed_icon}" "${desktop_file}"
          xvfb-run -a "${installed_application}" --check-startup
          "${XDG_DATA_HOME}/ogdd/uninstall-ogdd.sh"
          test ! -e "${installed_application}"
          test ! -e "${desktop_file}"

      - name: Upload Windows startup diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ogdd-windows-startup-diagnostics
          path: ogdd-startup-error.log
          if-no-files-found: warn

      - name: Upload installer
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ogdd-${{ matrix.artifact }}-installer
          path: dist/installers/*
          if-no-files-found: error
